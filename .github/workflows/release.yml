name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '릴리즈 버전 (예: 1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Enable Git LFS
        run: git lfs install

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller UnityPy Pillow TypeTreeGeneratorAPI fmod_toolkit archspec opencv-python-headless mapbox-earcut numpy

      - name: Build executables
        run: |
          pyinstaller --onefile --name unity_sprite_fullrect_replacer --collect-all UnityPy --collect-all TypeTreeGeneratorAPI --collect-all fmod_toolkit --collect-all archspec --collect-all cv2 --collect-all mapbox_earcut unity_sprite_fullrect_replacer.py
          pyinstaller --onefile --name unity_sprite_fullrect_replacer_en --collect-all UnityPy --collect-all TypeTreeGeneratorAPI --collect-all fmod_toolkit --collect-all archspec --collect-all cv2 --collect-all mapbox_earcut unity_sprite_fullrect_replacer_en.py
          pyinstaller --onefile --name UABEA_sprite_json_edit --collect-all UnityPy --collect-all TypeTreeGeneratorAPI --collect-all fmod_toolkit --collect-all archspec UABEA_sprite_json_edit.py
          pyinstaller --onefile --name UABEA_sprite_json_edit_en --collect-all UnityPy --collect-all TypeTreeGeneratorAPI --collect-all fmod_toolkit --collect-all archspec UABEA_sprite_json_edit_en.py

      - name: Prepare release files
        run: |
          mkdir release
          copy dist\unity_sprite_fullrect_replacer.exe release\
          copy dist\UABEA_sprite_json_edit.exe release\
          copy README.md release\
          mkdir release_en
          copy dist\unity_sprite_fullrect_replacer_en.exe release_en\
          copy dist\UABEA_sprite_json_edit_en.exe release_en\
          copy README_EN.md release_en\

      - name: Create ZIP archive
        run: |
          Compress-Archive -Path release\* -DestinationPath Unity_Sprite_Fullrect_Replacer_v${{ inputs.version }}.zip
          Compress-Archive -Path release_en\* -DestinationPath Unity_Sprite_Fullrect_Replacer_EN_v${{ inputs.version }}.zip

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.version }} ${{ github.sha }}
          git push origin v${{ inputs.version }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          draft: true
          files: |
            Unity_Sprite_Fullrect_Replacer_v${{ inputs.version }}.zip
            Unity_Sprite_Fullrect_Replacer_EN_v${{ inputs.version }}.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
